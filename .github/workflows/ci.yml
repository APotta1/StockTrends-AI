name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run grader tests
        run: python -m pytest -q

      - name: Offline eval sanity check (no API key)
        run: python -m app.evals.run_eval grade-demo

      - name: Smoke-test API boots in demo mode
        run: |
          python -c "from app.main import app; print('app import OK, routes:', len(app.routes))"
